services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulseq
      POSTGRES_PASSWORD: pulseq_dev_password
      POSTGRES_DB: pulseq
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulseq -d pulseq"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://pulseq:pulseq_dev_password@postgres:5432/pulseq
      REDIS_URL: redis://redis:6379/0
      API_KEY: dev-secret-change-me
      REDIS_STREAM: pulseq:jobs
      REDIS_GROUP: pulseq-workers
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker1:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://pulseq:pulseq_dev_password@postgres:5432/pulseq
      REDIS_URL: redis://redis:6379/0
      API_KEY: dev-secret-change-me
      REDIS_STREAM: pulseq:jobs
      REDIS_GROUP: pulseq-workers
      WORKER_NAME: worker-1
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker2:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://pulseq:pulseq_dev_password@postgres:5432/pulseq
      REDIS_URL: redis://redis:6379/0
      API_KEY: dev-secret-change-me
      REDIS_STREAM: pulseq:jobs
      REDIS_GROUP: pulseq-workers
      WORKER_NAME: worker-2
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  frontend:
    image: node:22-alpine
    working_dir: /web
    volumes: ["./frontend:/web"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on: [api]

volumes:
  postgres_data:
  redis_data:
